<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Here</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter&display=swap" rel="stylesheet">
    
  </head>
<body class="chat-page">
  <!-- Global site header (reused across all pages) -->
  <div data-include="components/header.html"></div>

     <main class="main">
      <div class="chat-shell">
        <div class="chat-header">
          <div class="agent-id">
            <div class="agent-avatar" aria-hidden="true">🤖</div>
            <div class="agent-meta">
              <div class="agent-name">UrSaviour Grocery Assistant</div>
              <div class="agent-status" id="agentStatus"><span class="status-dot online"></span> Online</div>
            </div>
          </div>
        </div>

        <!-- Messages box is injected above this input row by chatbot.js -->
        <div class="chat-container" style="display:flex; align-items:center; gap:8px;">
          <textarea id="Input-AI" class="chat-input" placeholder="Can we help with your grocery today?"></textarea>
          <button type="submit" class="chat-send-button" aria-label="Send message">Send</button>
          <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
        </div>
      </div>
      <p class="ai-powered-tag">Powered by UrSaviour AI · v1</p>
    </main>

    <div data-include="components/footer.html"></div>
    <script src="js/include.js" defer></script>
    <script src="js/main.js" defer></script> 
    <script src="js/product_page.js" defer></script>
    <script src="js/chatbot.js" defer></script>
</body>
</html>
