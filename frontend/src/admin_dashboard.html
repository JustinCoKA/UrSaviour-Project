<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Title - UrSaviour</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Global site header (reused across all pages) -->
  <div data-include="components/header.html"></div>

  <!-- 🔸 Main contents -->
  <main>
    <section class="hero">
      <h1>Admin Dashboard</h1>
      <p>Manage user accounts and product information</p>
    </section>
    
    <!-- Tab Navigation -->
    <section class="main-content">
      <div class="tab-container" style="margin-bottom: 20px;">
        <button class="tab-button active" onclick="switchTab('users')" id="usersTab">
          User Accounts
        </button>
        <button class="tab-button" onclick="switchTab('products')" id="productsTab">
          Products
        </button>
      </div>
      
      <!-- Users Tab Content -->
      <div id="usersContent" class="tab-content">
        <h2>User Accounts</h2>
        <div id="loading">Loading user data...</div>
        <div id="error" style="display: none; color: red;"></div>
        <table id="userTable" style="width: 100%; border-collapse: collapse; display: none;">
          <thead>
            <tr style="background-color: #f0f0f0;">
              <th style="border: 1px solid #ddd; padding: 8px;">User ID</th>
              <th style="border: 1px solid #ddd; padding: 8px;">Email</th>
              <th style="border: 1px solid #ddd; padding: 8px;">First Name</th>
              <th style="border: 1px solid #ddd; padding: 8px;">Last Name</th>
              <th style="border: 1px solid #ddd; padding: 8px;">Created At</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <!-- User rows will be inserted here -->
          </tbody>
        </table>
      </div>
      
      <!-- Products Tab Content -->
      <div id="productsContent" class="tab-content" style="display: none;">
        <h2>Products</h2>
        <div id="productsLoading">Loading products data...</div>
        <div id="productsError" style="display: none; color: red;"></div>
        <table id="productsTable" style="width: 100%; border-collapse: collapse; display: none;">
          <thead>
            <tr style="background-color: #f0f0f0;">
              <th style="border: 1px solid #ddd; padding: 8px;">Product ID</th>
              <th style="border: 1px solid #ddd; padding: 8px;">Product Name</th>
              <th style="border: 1px solid #ddd; padding: 8px;">Category</th>
              <th style="border: 1px solid #ddd; padding: 8px;">Unit Price</th>
              <th style="border: 1px solid #ddd; padding: 8px;">Special Price</th>
              <th style="border: 1px solid #ddd; padding: 8px;">Store</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <!-- Product rows will be inserted here -->
          </tbody>
        </table>
      </div>
    </section>
  </main>
  
  <style>
    .tab-container {
      display: flex;
      gap: 10px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 10px;
    }
    
    .tab-button {
      padding: 10px 20px;
      background-color: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 5px 5px 0 0;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }
    
    .tab-button:hover {
      background-color: #e0e0e0;
    }
    
    .tab-button.active {
      background-color: #007bff;
      color: white;
      border-color: #007bff;
    }
    
    .tab-content {
      margin-top: 20px;
    }
  </style>

  <script>
    // API Base URL
    const getBaseURL = () => {
      return window.location.hostname === 'www.ursaviour.com' || window.location.hostname === 'ursaviour.com'
        ? 'https://api.ursaviour.com/api/v1'
        : 'http://localhost:8000/api/v1';
    };
    
    // Tab switching function
    function switchTab(tab) {
      const usersTab = document.getElementById('usersTab');
      const productsTab = document.getElementById('productsTab');
      const usersContent = document.getElementById('usersContent');
      const productsContent = document.getElementById('productsContent');
      
      if (tab === 'users') {
        usersTab.classList.add('active');
        productsTab.classList.remove('active');
        usersContent.style.display = 'block';
        productsContent.style.display = 'none';
      } else if (tab === 'products') {
        usersTab.classList.remove('active');
        productsTab.classList.add('active');
        usersContent.style.display = 'none';
        productsContent.style.display = 'block';
        
        // Load products if not already loaded
        if (!window.productsLoaded) {
          loadProducts();
        }
      }
    }
    
    // Fetch users from API and display in table
    async function loadUsers() {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const tableEl = document.getElementById('userTable');
      const tbodyEl = document.getElementById('userTableBody');
      
      try {
        // Get auth token from localStorage
        const token = localStorage.getItem('access_token');
        if (!token) {
          window.location.href = 'login.html';
          return;
        }
        
        const baseURL = getBaseURL();
        const response = await fetch(`${baseURL}/users/users`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        
        if (!response.ok) {
          if (response.status === 401) {
            // Unauthorized - redirect to login
            localStorage.removeItem('access_token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
            return;
          }
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const users = await response.json();
        
        // Clear loading message
        loadingEl.style.display = 'none';
        
        // Show table
        tableEl.style.display = 'table';
        
        // Populate table
        tbodyEl.innerHTML = '';
        users.forEach(user => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td style="border: 1px solid #ddd; padding: 8px;">${user.userId || user.user_id || 'N/A'}</td>
            <td style="border: 1px solid #ddd; padding: 8px;">${user.email || 'N/A'}</td>
            <td style="border: 1px solid #ddd; padding: 8px;">${user.firstName || user.first_name || 'N/A'}</td>
            <td style="border: 1px solid #ddd; padding: 8px;">${user.lastName || user.last_name || 'N/A'}</td>
            <td style="border: 1px solid #ddd; padding: 8px;">${user.createdAt || user.created_at || 'N/A'}</td>
          `;
          tbodyEl.appendChild(row);
        });
        
      } catch (error) {
        console.error('Error loading users:', error);
        loadingEl.style.display = 'none';
        errorEl.textContent = 'Failed to load user data: ' + error.message;
        errorEl.style.display = 'block';
      }
    }
    
    // Fetch products from API and display in table
    async function loadProducts() {
      const loadingEl = document.getElementById('productsLoading');
      const errorEl = document.getElementById('productsError');
      const tableEl = document.getElementById('productsTable');
      const tbodyEl = document.getElementById('productsTableBody');
      
      try {
        const baseURL = getBaseURL();
        const response = await fetch(`${baseURL}/products/`);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const products = await response.json();
        
        // Clear loading message
        loadingEl.style.display = 'none';
        
        // Show table
        tableEl.style.display = 'table';
        
        // Populate table
        tbodyEl.innerHTML = '';
        products.forEach(product => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td style="border: 1px solid #ddd; padding: 8px;">${product.productId || product.product_id || 'N/A'}</td>
            <td style="border: 1px solid #ddd; padding: 8px;">${product.productName || product.product_name || 'N/A'}</td>
            <td style="border: 1px solid #ddd; padding: 8px;">${product.category || 'N/A'}</td>
            <td style="border: 1px solid #ddd; padding: 8px;">$${product.unitPrice || product.unit_price || 'N/A'}</td>
            <td style="border: 1px solid #ddd; padding: 8px;">$${product.specialPrice || product.special_price || 'N/A'}</td>
            <td style="border: 1px solid #ddd; padding: 8px;">${product.store || 'N/A'}</td>
          `;
          tbodyEl.appendChild(row);
        });
        
        window.productsLoaded = true;
        
      } catch (error) {
        console.error('Error loading products:', error);
        loadingEl.style.display = 'none';
        errorEl.textContent = 'Failed to load products data: ' + error.message;
        errorEl.style.display = 'block';
      }
    }
    
    // Load users when page loads
    document.addEventListener('DOMContentLoaded', loadUsers);
  </script>
  

  <!-- Global site footer (reused across all pages) -->
  <div data-include="components/footer.html"></div>

  <!-- Chat Assistant Button & Window -->
  <div data-include="components/chat.html"></div>

  <!-- JavaScript includes -->
  <script src="js/include.js" defer></script>
  <script src="js/chat-toggle.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
