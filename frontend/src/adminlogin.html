<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - UrSaviour</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Global site header (reused across all pages) -->
  <div data-include="components/header.html"></div>

  <!-- 🔸 Main contents -->
  <main>
    <!-- Content goes here -->
    <div class="auth-container">
    <h1>Admin Log In</h1>
    
    <div id="error-message" style="display: none; color: red; margin-bottom: 15px; padding: 10px; background-color: #ffe6e6; border-radius: 5px;"></div>

    <form id="adminLoginForm" class="auth-form">
      <label for="email">Admin Email *</label>
      <input type="email" id="email" name="email" placeholder="admin@admin.com" required>

      <label for="password">Password *</label>
      <input type="password" id="password" name="password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>
  </div>
  </main>


  <!-- Global site footer (reused across all pages) -->
  <div data-include="components/footer.html"></div>

  <!-- Chat Assistant Button & Window -->
  <div data-include="components/chat.html"></div>

  <!-- JavaScript includes -->
  <script src="js/include.js" defer></script>
  <script src="js/chat-toggle.js" defer></script>
  <script src="js/main.js" defer></script>
  
  <script>
    // Admin login - only admin@admin.com is allowed
    const ADMIN_EMAIL = 'admin@admin.com';
    
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('error-message');
      
      // Check if email is admin email
      if (email !== ADMIN_EMAIL) {
        errorMessage.textContent = 'Access denied. Only administrators can log in here.';
        errorMessage.style.display = 'block';
        return;
      }
      
      // Hide previous error
      errorMessage.style.display = 'none';
      
      // API endpoint
      const baseURL = window.location.hostname === 'www.ursaviour.com' || window.location.hostname === 'ursaviour.com'
        ? 'https://api.ursaviour.com/api/v1'
        : 'http://localhost:8000/api/v1';
      
      try {
        const response = await fetch(`${baseURL}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            email: email,
            password: password
          })
        });
        
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.detail || `Login failed with status: ${response.status}`);
        }
        
        const data = await response.json();
        
        // Store token
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('user', JSON.stringify({
          email: email,
          isAdmin: true
        }));
        
        // Redirect to admin dashboard
        window.location.href = 'admin_dashboard.html';
        
      } catch (error) {
        console.error('Login error:', error);
        // Better error message handling
        if (error instanceof Error) {
          errorMessage.textContent = error.message;
        } else if (typeof error === 'object' && error.detail) {
          errorMessage.textContent = error.detail;
        } else {
          errorMessage.textContent = 'Login failed. Please check your credentials and try again.';
        }
        errorMessage.style.display = 'block';
      }
    });
  </script>
</body>
</html>
