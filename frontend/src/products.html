<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UrSaviour - Products</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css"/>
  <style>
    /* Responsive grid layout for products */
    #product-gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 20px;
      background: #f9f9f9;
      min-height: 400px;
    }
    
    @media (max-width: 1200px) {
      #product-gallery {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    
    @media (max-width: 900px) {
      #product-gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    @media (max-width: 600px) {
      #product-gallery {
        grid-template-columns: 1fr;
      }
    }
    
    .product-layout {
      display: flex;
      gap: 20px;
    }
    
    .filter-panel {
      flex: 0 0 250px;
    }
    
    .product-content {
      flex: 1;
    }

    /* Side Cart Drawer */
    .side-cart {
      position: fixed;
      top: 0;
      right: 0;
      width: 360px;
      max-width: 90vw;
      height: 100vh;
      background: #ffffff;
      box-shadow: -2px 0 12px rgba(0,0,0,0.1);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }

    .side-cart.open {
      transform: translateX(0);
    }

    .side-cart .cart-header,
    .side-cart .cart-footer {
      padding: 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .side-cart .cart-footer { border-bottom: 0; border-top: 1px solid #eee; }

    .side-cart .cart-body {
      padding: 12px 16px;
      overflow-y: auto;
      flex: 1;
    }

    .store-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 8px;
      border-bottom: 1px solid #f1f1f1;
    }

    .store-row .brand { font-weight: 600; }
    .store-row .prices { display: flex; gap: 8px; align-items: baseline; }
    .store-row .prices .original { text-decoration: line-through; color: #999; font-size: 0.9em; }
    .store-row .prices .current { color: #111; font-weight: 700; }

    .heart-btn {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 4px;
      color: #c2c2c2;
    }
    .heart-btn.active { color: #e0245e; }

    .checkout-button {
      width: 100%;
      padding: 10px 12px;
      background: #111827;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Global Header -->
  <div data-include="components/header.html"></div>
  <main class="product-page">

    <!-- Search Bar (wide) -->
    <div id="searching-bar" class="searching-bar">
      <input id="searchInput" type="text" placeholder="🔍 Search products or categories"/>
    </div>

    <div class="product-layout">
      <!-- Filters (open by default; can be closed) -->
      <aside class="filter-panel">
        <h2 class="filter-title">Filter by</h2>

        <div class="filter-section">
          <h3>Categories</h3>
          <div class="panel open">
            <button class="valuesButton" data-filter="all">Show All</button>
            <button class="valuesButton" data-filter="Bakery">Bakery</button>
            <button class="valuesButton" data-filter="Beverages">Beverages</button>
            <button class="valuesButton" data-filter="Dairy">Dairy</button>
            <button class="valuesButton" data-filter="Health">Health</button>
            <button class="valuesButton" data-filter="Household">Household</button>
            <button class="valuesButton" data-filter="Meat">Meat</button>
            <button class="valuesButton" data-filter="Snacks">Snacks</button>
            <button class="valuesButton" data-filter="Frozen">Frozen</button>
            <button class="valuesButton" data-filter="Fruit">Fruit</button>
            <button class="valuesButton" data-filter="Pantry">Pantry</button>
          </div>
        </div>

        <div class="filter-section">
          <h3>Special Offers</h3>
          <div class="panel open">
            <button class="valuesButton" data-offer="all">Show All</button>
            <button class="valuesButton" data-offer="Half Price">Half Price</button>
            <button class="valuesButton" data-offer="30% OFF">30% OFF</button>
            <button class="valuesButton" data-offer="10% OFF">10% OFF</button>
            <button class="valuesButton" data-offer="Big deal">Big deal</button>
          </div>
        </div>

        <div class="filter-section">
          <h3>Price Range</h3>
          <div class="panel open">
            <input type="range" id="priceRange" min="0" max="100" value="25">
            <p>Selected Price: $<span id="currentPrice">25</span></p>
          </div>
        </div>
      </aside>

      <!-- Product Grid -->
      <section id="product-gallery" class="product-gallery"></section>
    </div>

    <!-- Pagination -->
    <nav id="pagination" class="pagination"></nav>

    <!-- Side Cart Drawer -->
    <div id="side-cart-drawer" class="side-cart">
    <div class="cart-header">
        <h2>Information Cart</h2>
        <button onclick="closeCartDrawer()">×</button>
    </div>
    <div id="cart-contents" class="cart-body">
        <p>Your cart is empty.</p>
    </div>
    <div class="cart-footer">
        <p>Subtotal <span id="cart-total">$0.00</span></p>
        <button class="checkout-button">Proceed to Checkout</button>
    </div>
</div>
  </main>

  <!-- Footer -->
  <div data-include="components/footer.html"></div>
  <!-- Chat -->
  <div data-include="components/chat.html"></div>

  <!-- Scripts -->
  <script src="js/include.js" defer></script>
  <script src="js/chat-toggle.js" defer></script>
  <!-- REMOVED: simple_api_loader.js causing field mapping conflicts -->
  <script src="js/product_page.js?v=20251018020000" defer></script>
  <script src="js/banner-fix.js" defer></script>
</body>
</html>
